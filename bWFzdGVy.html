  <title>？？？？、？？？？？？？？？？？？？</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --text: #d8d4dc;
    }

    @font-face {
      font-family: "Win98PixelTitle";
      src: url("./assets/fonts/d2luOTgtcGl4ZWw=.ttf") format("truetype");
      font-display: swap;
    }

    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      height: 100%;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Consolas, "Lucida Console", "Courier New", monospace;
    }

    .screen {
      width: 100vw;
      max-width: 100vw;
      height: 100vh;
      height: 100dvh;
      padding: clamp(10px, 2.2vw, 26px);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .video-guide {
      width: min(calc(100vw - 56px), calc((100dvh - 28px) * 9 / 16));
      aspect-ratio: 9 / 16;
      display: grid;
      place-items: center;
      border-block: 0;
      border-inline: 0;
    }

    .win98-window {
      width: 90%;
      aspect-ratio: 1 / 1.08;
      transform: translateY(-2.2em);
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: transparent;
      border: 2px solid;
      border-color: #f4f4f4 #3f3f3f #3f3f3f #f4f4f4;
      box-shadow:
        2px 2px 0 rgba(0, 0, 0, 0.78),
        inset 1px 1px 0 #ffffff,
        inset -1px -1px 0 #808080;
    }

    .win98-titlebar {
      flex: 0 0 auto;
      min-height: 24px;
      margin: 2px;
      padding: 2px 3px 2px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: linear-gradient(90deg, #000080 0%, #0a3d9f 58%, #1084d0 100%);
      color: #ffffff;
      font-family: "Win98PixelTitle", "MS Sans Serif", Tahoma, Arial, sans-serif;
      font-size: 13px;
      font-weight: 400;
      line-height: 1;
      text-shadow: none;
      -webkit-font-smoothing: none;
      font-smooth: never;
      text-rendering: optimizeSpeed;
      user-select: none;
    }

    .win98-title-label {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .win98-title-icon {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      image-rendering: pixelated;
      object-fit: contain;
    }

    .win98-title-text {
      display: block;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      line-height: 1;
      transform: translateY(1px);
    }

    .win98-buttons {
      display: flex;
      gap: 2px;
      flex: 0 0 auto;
    }

    .win98-button {
      position: relative;
      width: 18px;
      height: 16px;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 0;
      background: #c0c0c0;
      border: 1px solid;
      border-color: #ffffff #404040 #404040 #ffffff;
      box-shadow:
        inset 1px 1px 0 #dfdfdf,
        inset -1px -1px 0 #808080;
      color: #000000;
      font-size: 0;
      font-weight: 700;
      line-height: 1;
    }

    .win98-button::before,
    .win98-button::after {
      content: "";
      position: absolute;
      display: block;
    }

    .win98-button.minimize::before {
      left: 4px;
      right: 4px;
      bottom: 3px;
      height: 2px;
      background: #000000;
    }

    .win98-button.maximize::before {
      width: 8px;
      height: 7px;
      top: 50%;
      left: 50%;
      box-sizing: border-box;
      border: 2px solid #000000;
      transform: translate(-50%, -50%);
    }

    .win98-button.close::before,
    .win98-button.close::after {
      width: 10px;
      height: 2px;
      top: 50%;
      left: 50%;
      background: #000000;
      transform: translate(-50%, -50%) rotate(45deg);
    }

    .win98-button.close::after {
      transform: translate(-50%, -50%) rotate(-45deg);
    }

    .win98-content {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      margin: 0 4px 4px;
      padding: clamp(2px, 0.7vw, 5px);
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: transparent;
      border: 2px solid;
      border-color: #404040 #ffffff #ffffff #404040;
      box-shadow:
        inset 1px 1px 0 #000000,
        inset -1px -1px 0 #dfdfdf;
    }

    .background-rain {
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: 1;
      opacity: 0.72;
      mix-blend-mode: screen;
    }

    .background-vignette {
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: 2;
      background: rgba(5, 5, 5, 0.34);
    }

    .scanlines {
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: 4;
      opacity: 0.35;
      mix-blend-mode: screen;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.026) 0,
        rgba(255, 255, 255, 0.026) 1px,
        transparent 1px,
        transparent 4px
      );
    }

    .notice-card {
      position: relative;
      z-index: 3;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: minmax(0, 0.16fr) auto minmax(max-content, 0.84fr);
      justify-items: center;
      align-items: center;
      gap: 0;
      text-align: center;
      text-shadow: 0 0 12px rgba(216, 212, 220, 0.22);
    }

    .notice-gif {
      grid-row: 2;
      display: block;
      width: 100%;
      height: auto;
      image-rendering: auto;
      filter: none;
    }

    .notice-key {
      grid-row: 3;
      position: relative;
      z-index: 2;
      margin: 0;
      align-self: center;
      color: rgba(224, 217, 230, 0.96);
      font-size: clamp(20px, 4.5vw, 34px);
      line-height: 1.03;
      letter-spacing: 0;
      white-space: nowrap;
      overflow-wrap: normal;
      word-break: normal;
      min-height: 0;
      transform: none;
    }

    .cursor {
      display: inline-block;
      width: 0.62em;
      height: 1.1em;
      margin-left: 0.08em;
      transform: translateY(0.18em);
      background: rgba(238, 238, 238, 0.9);
      animation: blink 0.85s steps(1) infinite;
      box-shadow: 0 0 10px rgba(238, 238, 238, 0.4);
    }

    .pre-cursor-noise {
      display: inline-block;
      min-width: 1ch;
      color: rgba(194, 164, 235, 0.76);
      text-shadow:
        0 0 10px rgba(170, 128, 220, 0.46),
        0 0 22px rgba(105, 70, 155, 0.32);
    }

    @keyframes blink {
      0%, 48% {
        opacity: 1;
      }
      49%, 100% {
        opacity: 0;
      }
    }

    @media (max-width: 640px) {
      .screen {
        padding: 8px;
      }

      .video-guide {
        width: min(calc(100vw - 44px), calc((100dvh - 20px) * 9 / 16));
      }

      .win98-titlebar {
        min-height: 22px;
        gap: 6px;
        padding-left: 5px;
        font-size: 12px;
      }

      .win98-title-text {
        transform: translateY(1px);
      }

      .win98-button {
        width: 17px;
        height: 15px;
        font-size: 0;
      }

      .win98-content {
        margin: 0 3px 3px;
        padding: 2px;
      }

      .notice-card {
        gap: 0;
        grid-template-rows: minmax(0, 0.12fr) auto minmax(max-content, 0.88fr);
      }

      .notice-key {
        font-size: clamp(14px, 4.1vw, 17px);
        line-height: 1.03;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <main class="screen" aria-label="Notice GIF margin layout">
    <div class="video-guide" aria-label="9:16 guide">
      <section class="win98-window" aria-label="Windows 98 notice frame">
        <div class="win98-titlebar" aria-hidden="true">
          <span class="win98-title-label">
            <img class="win98-title-icon" src="../favicon.png" alt="">
            <span class="win98-title-text">？？？？、？？？？？？？？？？？？？</span>
          </span>
          <span class="win98-buttons">
            <span class="win98-button minimize">_</span>
            <span class="win98-button maximize">□</span>
            <span class="win98-button close">×</span>
          </span>
        </div>
        <div class="win98-content">
          <canvas class="background-rain" id="backgroundRain" aria-hidden="true"></canvas>
          <div class="background-vignette" aria-hidden="true"></div>
          <div class="notice-card">
            <img class="notice-gif" src="./assets/bWFzdGVy/bWFzdGVy.gif" alt="">
            <p class="notice-key" id="noticeKey" aria-label="binary caption"></p>
          </div>
          <div class="scanlines" aria-hidden="true"></div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const backgroundRainCanvas = document.querySelector("#backgroundRain");
    const backgroundRainContext = backgroundRainCanvas.getContext("2d");
    const noticeKey = document.querySelector("#noticeKey");
    const backgroundGlyphs = "01#$%&*+-/<>?=[]{}@ABCDEFGHIJKLMNOPQRSTUVWXYZ¥";
    const preCursorGlyphs = "01#$%&*+-/<>?=[]{}@¥ZXCVBNM";
    const noticeText = "32 36 31 30 3f 3f 3f🤔";
    const speeds = {
      normal: { min: 28, max: 82, lineDelay: 210 }
    };
    let backgroundRainColumns = [];
    let backgroundRainColumnCount = 0;
    let backgroundRainFontSize = 16;
    let backgroundRainIntensity = 0.72;

    function getBackgroundRainSize() {
      const bounds = backgroundRainCanvas.parentElement.getBoundingClientRect();
      return {
        width: Math.max(1, Math.floor(bounds.width)),
        height: Math.max(1, Math.floor(bounds.height))
      };
    }

    function resizeBackgroundRain() {
      const { width, height } = getBackgroundRainSize();
      const pixelRatio = window.devicePixelRatio || 1;
      backgroundRainCanvas.width = Math.floor(width * pixelRatio);
      backgroundRainCanvas.height = Math.floor(height * pixelRatio);
      backgroundRainCanvas.style.width = `${width}px`;
      backgroundRainCanvas.style.height = `${height}px`;
      backgroundRainContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

      backgroundRainFontSize = Math.max(13, Math.min(18, Math.floor(width / 70)));
      backgroundRainColumnCount = Math.ceil(width / backgroundRainFontSize);
      backgroundRainColumns = Array.from({ length: backgroundRainColumnCount }, () => (
        Math.floor(Math.random() * height / backgroundRainFontSize)
      ));
    }

    function drawBackgroundRain() {
      const { width, height } = getBackgroundRainSize();
      backgroundRainContext.fillStyle = `rgba(5, 5, 5, ${0.095 + backgroundRainIntensity * 0.045})`;
      backgroundRainContext.fillRect(0, 0, width, height);
      backgroundRainContext.font = `${backgroundRainFontSize}px Consolas, "Courier New", monospace`;

      for (let index = 0; index < backgroundRainColumnCount; index += 1) {
        if (Math.random() > 0.48 + backgroundRainIntensity * 0.32) {
          continue;
        }

        const glyph = backgroundGlyphs[Math.floor(Math.random() * backgroundGlyphs.length)];
        const x = index * backgroundRainFontSize;
        const y = backgroundRainColumns[index] * backgroundRainFontSize;
        backgroundRainContext.fillStyle = Math.random() > 0.84
          ? `rgba(210, 186, 242, ${0.32 + backgroundRainIntensity * 0.34})`
          : `rgba(132, 92, 176, ${0.21 + backgroundRainIntensity * 0.28})`;
        backgroundRainContext.fillText(glyph, x, y);

        if (y > height + backgroundRainFontSize && Math.random() > 0.965) {
          backgroundRainColumns[index] = 0;
        } else {
          backgroundRainColumns[index] += 1;
        }
      }

      backgroundRainIntensity = Math.max(0.68, backgroundRainIntensity * 0.99);
      requestAnimationFrame(drawBackgroundRain);
    }

    function wait(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function randomDelay(speedName = "normal") {
      const speed = speeds[speedName] || speeds.normal;
      return speed.min + Math.random() * (speed.max - speed.min);
    }

    function boostBackgroundRain(amount = 0.34) {
      backgroundRainIntensity = Math.min(1, backgroundRainIntensity + amount);
    }

    function randomNoiseText(maxLength = 3) {
      const length = 1 + Math.floor(Math.random() * maxLength);
      let text = "";

      for (let index = 0; index < length; index += 1) {
        text += preCursorGlyphs[Math.floor(Math.random() * preCursorGlyphs.length)];
      }

      return text;
    }

    resizeBackgroundRain();
    window.addEventListener("resize", resizeBackgroundRain);
    if (window.ResizeObserver) {
      new ResizeObserver(resizeBackgroundRain).observe(backgroundRainCanvas.parentElement);
    }
    drawBackgroundRain();

    async function typeNoticeText() {
      const cursor = document.createElement("span");
      cursor.className = "cursor";
      cursor.setAttribute("aria-hidden", "true");
      const textNode = document.createTextNode("");
      const noise = document.createElement("span");
      noise.className = "pre-cursor-noise";
      noticeKey.append(textNode, noise, cursor);

      for (const character of noticeText) {
        const flickers = 2 + Math.floor(Math.random() * 2);
        for (let index = 0; index < flickers; index += 1) {
          noise.textContent = randomNoiseText(3);
          boostBackgroundRain(0.22);
          await wait(10 + Math.random() * 18);
        }

        noise.textContent = "";
        textNode.nodeValue += character;
        boostBackgroundRain(0.28);
        await wait(randomDelay("normal"));
      }

      noise.remove();
      await wait(speeds.normal.lineDelay);
    }

    typeNoticeText();
  </script>
</body>
</html>
