<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --white: #ffffff;
    --bg: #f9f9f7;
    --text-main: #1a1a1a;
    --text-sub: #555;
    --text-muted: #888;
    --border: #e0e0dc;
    --link: #005bac;
    --tag-bg: #f2f2f0;
    --cyber-red: #9f102a;
    --cyber-cyan: #3dd7f0;
    --horror-green: #86ff6d;
    --horror-violet: #4f143c;
    --horror-black: #060307;
  }

  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif;
    background: var(--bg);
    color: var(--text-main);
    line-height: 1.8;
    font-size: 15px;
  }

  header {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 2.5rem 0 2rem;
    text-align: center;
  }

  header .site-name {
    font-size: 12px;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 0.75rem;
  }

  header h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 3rem 1.5rem 5rem;
  }

  .nav-links {
    display: flex;
    justify-content: center;
    gap: 0.75rem;
    flex-wrap: wrap;
    padding: 1rem 1.5rem;
    background: var(--white);
    border-bottom: 1px solid var(--border);
  }

  .nav-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    min-height: 38px;
    font-size: 13px;
    font-weight: 600;
    color: #185fa5;
    text-decoration: none;
    padding: 0.5rem 1.1rem;
    border: 1.5px solid #85b7eb;
    border-radius: 4px;
    background: #e6f1fb;
    transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.15s, box-shadow 0.15s;
    white-space: nowrap;
  }

  .nav-link:hover {
    background: #b5d4f4;
    border-color: #378add;
    color: #0c447c;
  }

  .nav-link svg,
  .dl-btn svg {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .nav-link.find-me,
  .dl-btn.find-me {
    position: relative;
    isolation: isolate;
    z-index: 0;
    overflow: hidden;
    color: #d6ffd0;
    background:
      radial-gradient(circle at 72% 45%, rgba(148, 0, 55, 0.55), transparent 38%),
      linear-gradient(135deg, rgba(6, 3, 7, 0.98), rgba(79, 20, 60, 0.96) 58%, rgba(28, 7, 18, 0.98));
    border: 0;
    text-shadow: 0 0 8px rgba(134, 255, 109, 0.72);
    box-shadow:
      inset 0 0 0 1px rgba(134, 255, 109, 0.16),
      0 0 16px rgba(79, 20, 60, 0.28);
  }

  .nav-link.find-me::before,
  .dl-btn.find-me::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      linear-gradient(90deg, transparent 0 7%, rgba(255, 255, 255, 0.18) 7% 8.5%, transparent 8.5% 16%),
      linear-gradient(90deg, transparent 0 41%, rgba(255, 37, 61, 0.18) 41% 42%, transparent 42% 100%),
      linear-gradient(0deg, rgba(255, 255, 255, 0.1) 0 1px, transparent 1px 3px),
      radial-gradient(circle at 28% 42%, rgba(134, 255, 109, 0.22), transparent 26%);
    mix-blend-mode: screen;
    opacity: 0.58;
    animation: find-me-static 1.35s steps(2, end) infinite;
  }

  .nav-link.find-me::after,
  .dl-btn.find-me::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    box-shadow: inset 0 0 0 1px rgba(255, 37, 61, 0);
    opacity: 0;
  }

  .nav-link.find-me:hover,
  .dl-btn.find-me:hover {
    color: #ffffff;
    background:
      linear-gradient(135deg, #030104, #341125 48%, #5d0824 100%);
    box-shadow:
      inset 0 0 0 1.5px rgba(255, 37, 61, 0.82),
      0 0 20px rgba(255, 37, 61, 0.34),
      0 0 34px rgba(159, 16, 42, 0.32);
    transform: translateY(-1px);
  }

  .nav-link.find-me:hover::before,
  .dl-btn.find-me:hover::before {
    opacity: 0.54;
    animation-duration: 0.9s;
  }

  .nav-link.find-me:hover::after,
  .dl-btn.find-me:hover::after {
    opacity: 1;
    animation: find-me-pulse 1.35s ease-in-out infinite;
  }

  .nav-link.find-me svg,
  .dl-btn.find-me svg,
  .find-me-text {
    position: relative;
    z-index: 1;
  }

  .nav-link.find-me svg,
  .dl-btn.find-me svg {
    filter:
      drop-shadow(0 0 3px rgba(134, 255, 109, 0.72))
      drop-shadow(0 0 8px rgba(134, 255, 109, 0.34));
  }

  .nav-link.find-me:hover svg,
  .dl-btn.find-me:hover svg {
    filter:
      drop-shadow(0 0 4px rgba(255, 37, 61, 0.84))
      drop-shadow(0 0 10px rgba(134, 255, 109, 0.42));
  }

  .find-me-text {
    display: inline-block;
  }

  .find-me-text::before,
  .find-me-text::after {
    content: attr(data-text);
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
  }

  .find-me-text::before {
    color: #ff253d;
    transform: translate(-1px, 0);
  }

  .find-me-text::after {
    color: #86ff6d;
    transform: translate(1px, 0);
  }

  .find-me:hover .find-me-text {
    animation: find-me-glitch 1.05s steps(2, end) infinite;
  }

  .find-me:hover .find-me-text::before,
  .find-me:hover .find-me-text::after {
    opacity: 0.58;
    animation: find-me-ghost 0.75s steps(2, end) infinite;
  }

  .notice {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1.1rem 1.5rem;
    margin-bottom: 2.5rem;
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
  }

  .notice a {
    color: var(--link);
    text-decoration: none;
  }

  .notice a:hover { text-decoration: underline; }

  .track-list {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .track-card {
    --button-grid-width: min(100%, 540px);
    --button-row-gap: 0.9rem;
    --card-row-gap: 1rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--card-row-gap);
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    padding: 1.5rem;
  }

  .track-title {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-align: center;
  }

  .track-credit {
    color: var(--text-muted);
    font-size: 13px;
    line-height: 1.5;
    letter-spacing: 0.03em;
    text-align: center;
  }

  .track-credit a {
    color: var(--link);
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 0.18em;
  }

  .track-credit a:hover {
    color: #003f7f;
  }

  .track-meta {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--text-muted);
    font-size: 13px;
    letter-spacing: 0.03em;
  }

  .track-meta::before,
  .track-meta::after {
    content: "";
    width: 18px;
    height: 1px;
    background: var(--border);
  }

  .movie-links {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.75rem;
    width: var(--button-grid-width);
  }

  .track-body,
  .find-me-row {
    display: flex;
    justify-content: center;
    gap: var(--button-row-gap);
    flex-wrap: wrap;
  }

  .track-body {
    width: 100%;
    flex-direction: column;
    align-items: center;
  }

  .track-actions {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.75rem;
    width: var(--button-grid-width);
  }

  .find-me-row {
    width: var(--button-grid-width);
  }

  .movie-links .dl-btn,
  .track-actions .dl-btn {
    width: 100%;
  }

  .find-me-row .dl-btn {
    min-width: min(240px, 100%);
  }

  .dl-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    min-height: 38px;
    background: var(--text-main);
    color: var(--white);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 0.55rem 1.25rem;
    border-radius: 4px;
    transition: opacity 0.15s, transform 0.15s;
    white-space: nowrap;
  }

  .dl-btn:hover {
    opacity: 0.78;
  }

  .dl-btn.secondary {
    color: var(--text-main);
    background: var(--tag-bg);
    border: 1px solid var(--border);
  }

  .dl-btn.accent {
    background: var(--text-main);
  }

  @keyframes find-me-static {
    0%, 100% { transform: translate3d(0, 0, 0); opacity: 0.48; }
    18% { transform: translate3d(-5%, 1px, 0); opacity: 0.72; }
    36% { transform: translate3d(4%, -1px, 0); opacity: 0.4; }
    57% { transform: translate3d(6%, 0, 0); opacity: 0.78; }
    74% { transform: translate3d(-2%, -1px, 0); opacity: 0.52; }
  }

  @keyframes find-me-pulse {
    0%, 100% {
      box-shadow:
        inset 0 0 0 1px rgba(255, 37, 61, 0.52),
        0 0 0 rgba(255, 37, 61, 0);
    }
    50% {
      box-shadow:
        inset 0 0 0 2px rgba(255, 37, 61, 0.95),
        0 0 18px rgba(255, 37, 61, 0.45);
    }
  }

  @keyframes find-me-glitch {
    0%, 72%, 100% { transform: translate(0, 0); }
    18% { transform: translate(-1px, 0); }
    20% { transform: translate(1px, -1px); }
    42% { transform: translate(0, 1px); }
    44% { transform: translate(-1px, -1px); }
  }

  @keyframes find-me-ghost {
    0%, 100% { clip-path: inset(0 0 0 0); }
    33% { clip-path: inset(0 0 58% 0); }
    66% { clip-path: inset(46% 0 0 0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .nav-link.find-me::before,
    .dl-btn.find-me::before,
    .nav-link.find-me:hover::after,
    .dl-btn.find-me:hover::after,
    .find-me:hover .find-me-text,
    .find-me:hover .find-me-text::before,
    .find-me:hover .find-me-text::after {
      animation: none;
    }
  }

  footer {
    text-align: center;
    padding: 2rem;
    font-size: 12px;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
  }

  @media (max-width: 600px) {
    header { padding: 2rem 1rem 1.65rem; }
    header h1 { font-size: 20px; }
    main { padding: 1.5rem 1rem 4rem; }
    .nav-links { align-items: stretch; }
    .nav-link, .dl-btn { width: 100%; }
    .track-card { align-items: stretch; }
    .movie-links, .track-actions { grid-template-columns: 1fr; width: 100%; }
    .find-me-row { width: 100%; }
    .find-me-row .dl-btn { min-width: 0; }
  }
</style>
