<!doctype html>
<html lang="ja">
<head>

  <title>ＩＭＡ　ＦＩＮＤ　ＹＯＵ</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --text: #d7d7d7;
      --cursor: #eeeeee;
      --green: #62ff91;
      --yellow: #ffd95a;
      --crimson: #b00020;
      --error: #ff5f6d;
    }

    @font-face {
      font-family: "Win98PixelTitle";
      src: url("./assets/fonts/win98-pixel.ttf") format("truetype");
      font-display: swap;
    }

    * {
      box-sizing: border-box;
    }

    html {
      height: 100%;
      width: 100%;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.035), transparent 38%),
        var(--bg);
      color: var(--text);
      font-family: Consolas, "Lucida Console", "Courier New", monospace;
      overflow: hidden;
    }

    .screen {
      position: relative;
      z-index: 4;
      height: 100vh;
      height: 100dvh;
      padding: clamp(12px, 2.6vw, 30px);
      display: flex;
      align-items: stretch;
      justify-content: center;
      overflow: hidden;
      width: 100vw;
      max-width: 100vw;
    }

    .win98-window {
      width: min(1180px, 100%);
      height: 100%;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: transparent;
      border: 2px solid;
      border-color: #f4f4f4 #3f3f3f #3f3f3f #f4f4f4;
      box-shadow:
        2px 2px 0 rgba(0, 0, 0, 0.78),
        inset 1px 1px 0 #ffffff,
        inset -1px -1px 0 #808080;
    }

    .win98-titlebar {
      flex: 0 0 auto;
      min-height: 24px;
      margin: 2px;
      padding: 2px 3px 2px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background:
        linear-gradient(90deg, #000080 0%, #0a3d9f 58%, #1084d0 100%);
      color: #ffffff;
      font-family: "Win98PixelTitle", "MS Sans Serif", Tahoma, Arial, sans-serif;
      font-size: 13px;
      font-weight: 400;
      line-height: 1;
      text-shadow: none;
      -webkit-font-smoothing: none;
      font-smooth: never;
      text-rendering: optimizeSpeed;
      user-select: none;
    }

    .win98-title-text {
      display: block;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      line-height: 1;
      transform: translateY(1px);
    }

    .win98-title-label {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .win98-title-icon {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      image-rendering: pixelated;
      object-fit: contain;
    }

    .win98-buttons {
      display: flex;
      gap: 2px;
      flex: 0 0 auto;
    }

    .win98-button {
      position: relative;
      width: 18px;
      height: 16px;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 0;
      background: #c0c0c0;
      border: 1px solid;
      border-color: #ffffff #404040 #404040 #ffffff;
      box-shadow:
        inset 1px 1px 0 #dfdfdf,
        inset -1px -1px 0 #808080;
      color: #000000;
      font-family: Arial, sans-serif;
      font-size: 0;
      font-weight: 700;
      line-height: 1;
    }

    .win98-button::before,
    .win98-button::after {
      content: "";
      position: absolute;
      display: block;
    }

    .win98-button.minimize::before {
      left: 4px;
      right: 4px;
      bottom: 3px;
      height: 2px;
      background: #000000;
    }

    .win98-button.maximize::before {
      width: 8px;
      height: 7px;
      top: 50%;
      left: 50%;
      box-sizing: border-box;
      border: 2px solid #000000;
      transform: translate(-50%, -50%);
    }

    .win98-button.close::before,
    .win98-button.close::after {
      width: 10px;
      height: 2px;
      top: 50%;
      left: 50%;
      background: #000000;
      transform: translate(-50%, -50%) rotate(45deg);
    }

    .win98-button.close::after {
      transform: translate(-50%, -50%) rotate(-45deg);
    }

    .win98-content {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      margin: 0 4px 4px;
      padding: clamp(12px, 1.8vw, 22px);
      position: relative;
      background: transparent;
      border: 2px solid;
      border-color: #404040 #ffffff #ffffff #404040;
      box-shadow:
        inset 1px 1px 0 #000000,
        inset -1px -1px 0 #dfdfdf;
      overflow: hidden;
    }

    .terminal {
      position: relative;
      z-index: 3;
      width: 100%;
      min-width: 0;
      height: 100%;
      max-width: none;
      line-height: 1.45;
      font-size: clamp(14px, 1.85vw, 22px);
      text-shadow: 0 0 10px rgba(215, 215, 215, 0.18);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding-right: 20px;
      padding-bottom: 12vh;
      scrollbar-width: none;
    }

    .terminal::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    .terminal::-webkit-scrollbar-track {
      background: #c0c0c0;
      border: 1px solid;
      border-color: #808080 #ffffff #ffffff #808080;
    }

    .terminal::-webkit-scrollbar-thumb {
      background: #c0c0c0;
      border: 1px solid;
      border-color: #ffffff #404040 #404040 #ffffff;
      box-shadow:
        inset 1px 1px 0 #dfdfdf,
        inset -1px -1px 0 #808080;
    }

    .mobile-win98-scrollbar {
      display: flex;
      position: absolute;
      top: 4px;
      right: 4px;
      bottom: 4px;
      z-index: 8;
      width: 16px;
      flex-direction: column;
      background: #c0c0c0;
      border: 1px solid;
      border-color: #ffffff #404040 #404040 #ffffff;
      box-shadow:
        inset 1px 1px 0 #dfdfdf,
        inset -1px -1px 0 #808080;
      pointer-events: auto;
    }

    .mobile-win98-scrollbar.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .mobile-win98-scrollbar-button {
      appearance: none;
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      flex: 0 0 14px;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 0;
      color: #000000;
      background: #c0c0c0;
      border: 1px solid;
      border-color: #ffffff #404040 #404040 #ffffff;
      box-shadow:
        inset 1px 1px 0 #dfdfdf,
        inset -1px -1px 0 #808080;
      font-family: Arial, sans-serif;
      font-size: 0;
      line-height: 1;
    }

    .mobile-win98-scrollbar-button::before {
      content: "";
      width: 0;
      height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
    }

    .mobile-win98-scrollbar-button:first-child::before {
      border-bottom: 6px solid #000000;
    }

    .mobile-win98-scrollbar-button:last-child::before {
      border-top: 6px solid #000000;
    }

    .mobile-win98-scrollbar-track {
      position: relative;
      flex: 1 1 auto;
      min-height: 24px;
      background: #d4d0c8;
      border-left: 1px solid #808080;
      border-right: 1px solid #ffffff;
      overflow: hidden;
    }

    .mobile-win98-scrollbar-thumb {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      min-height: 28px;
      background: #c0c0c0;
      border: 1px solid;
      border-color: #ffffff #404040 #404040 #ffffff;
      box-shadow:
        inset 1px 1px 0 #dfdfdf,
        inset -1px -1px 0 #808080;
      transform: translateY(0);
    }

    @media (hover: none), (pointer: coarse), (max-width: 768px) {
      .mobile-win98-scrollbar {
        display: flex;
      }

      .terminal {
        padding-right: 20px;
        scrollbar-width: none;
      }

      .terminal::-webkit-scrollbar {
        width: 0;
        height: 0;
      }
    }

    .line {
      min-height: 1.45em;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .ascii {
      font-size: clamp(10px, 1.08vw, 14px);
      line-height: 1.08;
      letter-spacing: 0;
      min-height: 1.08em;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .axis-label {
      color: rgba(215, 215, 215, 0.42);
      text-shadow: none;
    }

    .dim {
      color: rgba(215, 215, 215, 0.48);
      text-shadow: 0 0 8px rgba(215, 215, 215, 0.08);
    }

    .half-gap {
      height: 0.72em;
      min-height: 0.72em;
      line-height: 0.72em;
    }

    .error {
      color: var(--error);
      text-shadow: 0 0 12px rgba(255, 80, 80, 0.34);
    }

    .green {
      color: var(--green);
      text-shadow: 0 0 13px rgba(98, 255, 145, 0.38);
    }

    .dark-green {
      color: rgba(62, 142, 85, 0.95);
      text-shadow: 0 0 12px rgba(62, 142, 85, 0.28);
    }

    .dark-red {
      color: rgba(126, 18, 27, 0.92);
      text-shadow: 0 0 0.55em rgba(126, 18, 27, 0.24);
    }

    .yellow {
      color: var(--yellow);
      text-shadow: 0 0 13px rgba(255, 217, 90, 0.34);
    }

    .orange {
      color: #ff9b45;
      text-shadow: 0 0 13px rgba(255, 155, 69, 0.34);
    }

    .purple {
      color: #b98cff;
      text-shadow: 0 0 13px rgba(185, 140, 255, 0.36);
    }

    .pink {
      color: #ff8ac8;
      text-shadow: 0 0 13px rgba(255, 138, 200, 0.36);
    }

    .crimson {
      color: var(--crimson);
      font-weight: 700;
      text-shadow:
        0 0 10px rgba(176, 0, 32, 0.7),
        0 0 24px rgba(176, 0, 32, 0.42);
    }

    .terminal-link {
      color: #79b8ff;
      text-decoration: underline;
      text-underline-offset: 0.18em;
      text-shadow: 0 0 12px rgba(121, 184, 255, 0.32);
    }

    .terminal-link.access-link {
      color: #79b8ff;
      text-shadow: 0 0 12px rgba(121, 184, 255, 0.32);
    }

    .terminal a[x-apple-data-detectors]:not(.terminal-link) {
      color: inherit !important;
      text-decoration: none !important;
      pointer-events: none;
    }

    .prompt-form {
      display: flex;
      align-items: center;
      gap: 0.55em;
      min-height: 1.45em;
      margin-top: 0.04em;
    }

    .prompt-tools {
      margin: 0.35em 0 0.18em;
      color: rgba(215, 215, 215, 0.52);
      font-size: 0.68em;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .hint-button {
      border: 0;
      border-radius: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      line-height: inherit;
      padding: 0;
      cursor: pointer;
      text-decoration: none;
      text-shadow: inherit;
    }

    .hint-button:hover,
    .hint-button:focus-visible {
      color: rgba(215, 215, 215, 0.86);
      outline: 0;
      text-decoration: underline;
      text-underline-offset: 0.18em;
    }

    .hint-button + .hint-button {
      margin-left: 1.4em;
    }

    .hint-answer {
      margin: 0.25em 0 0.45em;
      color: rgba(215, 215, 215, 0.82);
      font-size: 0.78em;
      line-height: 1.35;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .prompt-fail {
      margin: 0.1em 0 0.15em;
      color: rgba(126, 18, 27, 0.92);
      font-size: 0.78em;
      line-height: 1.25;
      text-shadow: 0 0 0.55em rgba(126, 18, 27, 0.24);
      white-space: pre-wrap;
    }

    .prompt-fail:empty {
      display: none;
    }

    .abort-fail {
      color: rgba(126, 18, 27, 0.92);
      text-shadow: 0 0 0.55em rgba(126, 18, 27, 0.24);
    }

    .prompt-input {
      width: min(18ch, 48vw);
      border: 0;
      border-bottom: 1px solid rgba(215, 215, 215, 0.62);
      border-radius: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      line-height: 1.2;
      padding: 0 0 0.08em;
      text-shadow: inherit;
      caret-color: var(--cursor);
    }

    .prompt-input:focus {
      border-bottom-color: var(--cursor);
      box-shadow: 0 0.18em 0.6em -0.42em rgba(238, 238, 238, 0.8);
    }

    .send-button {
      border: 1px solid rgba(215, 215, 215, 0.68);
      border-radius: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      line-height: 1.05;
      padding: 0.3em 0.55em 0.16em;
      cursor: pointer;
      text-shadow: inherit;
    }

    .send-button:hover,
    .send-button:focus-visible {
      background: rgba(215, 215, 215, 0.13);
      outline: 0;
    }

    .share-form {
      margin-top: 0.2em;
    }

    .share-output {
      margin: 0.2em 0 0.45em;
    }

    .share-actions {
      display: flex;
      align-items: center;
      gap: 0.55em;
      flex-wrap: wrap;
    }

    .share-media {
      display: block;
      width: min(292px, 84vw);
      max-width: 100%;
      height: auto;
      image-rendering: auto;
      border: 1px solid rgba(215, 215, 215, 0.36);
      box-shadow: 0 0 18px rgba(194, 164, 235, 0.14);
    }

    .x-share-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45em;
      min-height: 2.1em;
      padding: 0.32em 0.82em;
      border-radius: 999px;
      border: 1px solid #2f3336;
      background: #000000;
      color: #ffffff;
      font: 700 0.72em Arial, Helvetica, sans-serif;
      line-height: 1;
      text-decoration: none;
      text-shadow: none;
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.12);
    }

    .x-share-button:hover,
    .x-share-button:focus-visible {
      background: #1d1f23;
      outline: 0;
    }

    .native-share-button {
      border-color: rgba(150, 175, 255, 0.72);
      background: rgba(92, 110, 185, 0.28);
      color: rgba(226, 230, 255, 0.98);
      box-shadow:
        inset 0 0 0 1px rgba(235, 238, 255, 0.08),
        0 0 14px rgba(120, 145, 235, 0.16);
    }

    .native-share-button:hover,
    .native-share-button:focus-visible {
      background: rgba(112, 135, 215, 0.38);
    }

    .share-status {
      color: rgba(126, 18, 27, 0.92);
      font-size: 0.78em;
      line-height: 1.25;
      text-shadow: 0 0 0.55em rgba(126, 18, 27, 0.24);
    }

    .send-button:disabled,
    .prompt-input:disabled {
      cursor: default;
      opacity: 0.45;
    }

    .cursor {
      display: inline-block;
      width: 0.62em;
      height: 1.1em;
      margin-left: 0.08em;
      transform: translateY(0.18em);
      background: var(--cursor);
      animation: blink 0.85s steps(1) infinite;
      box-shadow: 0 0 10px rgba(238, 238, 238, 0.4);
    }

    .pre-cursor-noise {
      display: inline-block;
      min-width: 1ch;
      color: rgba(194, 164, 235, 0.76);
      text-shadow:
        0 0 10px rgba(170, 128, 220, 0.46),
        0 0 22px rgba(105, 70, 155, 0.32);
    }

    .scanlines {
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: 4;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.025) 0,
        rgba(255, 255, 255, 0.025) 1px,
        transparent 1px,
        transparent 4px
      );
      opacity: 0.34;
      mix-blend-mode: screen;
    }

    .glitch-overlay {
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: 5;
      opacity: 0;
      overflow: hidden;
      background: transparent;
      mix-blend-mode: screen;
      transform: translate3d(0, 0, 0);
    }

    .glitch-overlay.is-active {
      animation: glitchOverlayPulse var(--glitch-duration, 220ms) steps(2, end) both;
    }

    .glitch-fragment {
      position: absolute;
      left: var(--fragment-x);
      top: var(--fragment-y);
      width: var(--fragment-width);
      height: var(--fragment-height);
      background: var(--fragment-color);
      opacity: var(--fragment-opacity, 0.86);
      box-shadow:
        1px 0 rgba(255, 255, 255, 0.22),
        -1px 0 rgba(0, 0, 0, 0.38);
      animation: glitchFragmentFlicker var(--glitch-duration, 220ms) steps(2, end) both;
    }

    .glitch-fragment.is-slice {
      height: 2px;
      box-shadow:
        0 1px rgba(255, 255, 255, 0.34),
        0 -1px rgba(0, 0, 0, 0.42);
    }

    .terminal.is-glitching {
      animation: glitchTextSplit var(--glitch-duration, 220ms) steps(2, end) both;
    }

    .background-reveal.is-glitching {
      animation: glitchBackgroundSkew var(--glitch-duration, 220ms) steps(2, end) both;
    }

    .background-rain {
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: 1;
      opacity: 0.46;
      mix-blend-mode: screen;
      transition: opacity 120ms steps(1, end);
    }

    .background-rain.is-typing {
      opacity: 0.72;
    }

    .background-reveal {
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(5, 5, 5, 0.3), rgba(5, 5, 5, 0.58)),
        url("./assets/background-reveal.png");
      background-position: center;
      background-size: cover;
      filter: saturate(0.72) contrast(0.88) brightness(0.42);
      opacity: var(--image-reveal, 0.018);
      transition: opacity 1400ms ease, filter 1400ms ease;
    }

    .background-vignette {
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: 2;
      background:
        radial-gradient(circle at 52% 34%, rgba(70, 40, 96, 0.08), transparent 32%),
        linear-gradient(90deg, rgba(5, 5, 5, 0.56), rgba(5, 5, 5, 0.18) 46%, rgba(5, 5, 5, 0.56)),
        linear-gradient(rgba(5, 5, 5, 0.12), rgba(5, 5, 5, 0.62));
    }

    @keyframes blink {
      0%, 48% {
        opacity: 1;
      }
      49%, 100% {
        opacity: 0;
      }
    }

    @keyframes glitchOverlayPulse {
      0%, 11% {
        opacity: 0;
        clip-path: inset(0 0 0 0);
      }
      12%, 68% {
        opacity: var(--glitch-opacity, 0.2);
        clip-path: inset(0 0 0 0);
      }
      69%, 100% {
        opacity: 0;
        clip-path: inset(0 0 0 0);
      }
    }

    @keyframes glitchFragmentFlicker {
      0%, 11% {
        opacity: 0;
      }
      12%, 68% {
        opacity: var(--fragment-opacity, 0.86);
      }
      69%, 100% {
        opacity: 0;
      }
    }

    @keyframes glitchTextSplit {
      0%, 100% {
        text-shadow: 0 0 10px rgba(215, 215, 215, 0.18);
        transform: translateX(0);
      }
      20% {
        text-shadow:
          calc(var(--glitch-shift, 2px) * -1) 0 rgba(168, 100, 210, 0.42),
          var(--glitch-shift, 2px) 0 rgba(120, 155, 230, 0.28),
          0 0 12px rgba(215, 215, 215, 0.16);
      }
      48% {
        text-shadow:
          var(--glitch-shift, 2px) 0 rgba(176, 0, 32, 0.32),
          calc(var(--glitch-shift, 2px) * -1) 0 rgba(160, 118, 220, 0.34),
          0 0 14px rgba(215, 215, 215, 0.14);
        transform: translateX(calc(var(--glitch-shift, 2px) * 0.18));
      }
      70% {
        text-shadow:
          -1px 0 rgba(198, 150, 235, 0.28),
          1px 0 rgba(120, 84, 170, 0.28),
          0 0 10px rgba(215, 215, 215, 0.12);
        transform: translateX(0);
      }
    }

    @keyframes glitchBackgroundSkew {
      0%, 100% {
        transform: translateX(0) scale(1);
      }
      22% {
        transform: translateX(calc(var(--glitch-shift, 2px) * -0.8)) scale(1.006);
      }
      46% {
        transform: translateX(calc(var(--glitch-shift, 2px) * 0.9)) scale(1.004);
      }
      68% {
        transform: translateX(calc(var(--glitch-shift, 2px) * -0.35)) scale(1.002);
      }
    }

    @media (max-width: 640px) {
      .screen {
        padding: 8px;
        touch-action: pan-y;
      }

      .win98-window {
        width: 100%;
      }

      .win98-titlebar {
        min-height: 22px;
        gap: 6px;
        padding-left: 5px;
        font-size: 12px;
      }

      .win98-title-text {
        transform: translateY(1px);
      }

      .win98-button {
        width: 17px;
        height: 15px;
        font-size: 0;
      }

      .win98-content {
        margin: 0 3px 3px;
        padding: 10px;
      }

      .terminal {

      const { width, height } = getBackgroundRainSize();
      const typingRain = backgroundRainTypingDepth > 0;
      const rainLook = typingRain
        ? {
            intensity: 0.72,
            fadeBase: 0.095,
            fadeScale: 0.045,
            drawBase: 0.48,
            drawScale: 0.32,
            brightBase: 0.32,
            brightScale: 0.34,
            dimBase: 0.21,
            dimScale: 0.28

            drawBase: 0.32,
            drawScale: 0.52,
            brightBase: 0.27,
            brightScale: 0.27,
            dimBase: 0.18,
            dimScale: 0.24

      backgroundRainContext.fillStyle = `rgba(5, 5, 5, ${rainLook.fadeBase + rainLook.intensity * rainLook.fadeScale})`;

        "rgba(48, 220, 235, 0.86)",

        "rgba(82, 82, 255, 0.86)",
        "rgba(255, 62, 62, 0.78)"
      ];
      const fragmentCount = 18 + strength * 14;
      const sliceCount = 10 + strength * 4;
      const fragment = document.createDocumentFragment();

      glitchOverlay.textContent = "";

      for (let index = 0; index < sliceCount; index += 1) {
        const slice = document.createElement("span");
        slice.className = "glitch-fragment is-slice";
        slice.style.setProperty("--fragment-x", `${randomRange(-4, 38)}%`);
        slice.style.setProperty("--fragment-y", `${randomRange(4, 94)}%`);
        slice.style.setProperty("--fragment-width", `${randomRange(20, 76)}%`);
        slice.style.setProperty("--fragment-height", `${randomRange(10, 28)}px`);
        slice.style.setProperty("--fragment-color", colors[Math.floor(Math.random() * colors.length)]);
        slice.style.setProperty("--fragment-opacity", randomRange(0.58, 0.98).toFixed(2));
        fragment.appendChild(slice);
      }

      for (let index = 0; index < fragmentCount; index += 1) {
        const block = document.createElement("span");
        const isWide = Math.random() > 0.58;
        block.className = "glitch-fragment";
        block.style.setProperty("--fragment-x", `${randomRange(0, 98)}%`);
        block.style.setProperty("--fragment-y", `${randomRange(0, 98)}%`);
        block.style.setProperty("--fragment-width", isWide ? `${randomRange(18, 150)}px` : `${randomRange(3, 16)}px`);
        block.style.setProperty("--fragment-height", isWide ? `${randomRange(8, 20)}px` : `${randomRange(3, 18)}px`);
        block.style.setProperty("--fragment-color", colors[Math.floor(Math.random() * colors.length)]);
        block.style.setProperty("--fragment-opacity", randomRange(0.5, 0.95).toFixed(2));
        fragment.appendChild(block);
      }

      glitchOverlay.appendChild(fragment);
    }

    function triggerProgressGlitch(level = 1) {
      const strength = Math.min(Math.max(level, 1), 5);
      const duration = 420 + strength * 90;
      const opacity = 0.34 + strength * 0.08;

      window.clearTimeout(glitchTimer);
      renderGlitchFragments(strength);
      [glitchOverlay, terminal, backgroundReveal].forEach((element) => {
        element.classList.remove("is-active", "is-glitching");
        element.style.setProperty("--glitch-duration", `${duration}ms`);
        element.style.setProperty("--glitch-opacity", opacity);
      });

      glitchOverlay.offsetWidth;
      glitchOverlay.classList.add("is-active");
      terminal.classList.add("is-glitching");
      backgroundReveal.classList.add("is-glitching");

      glitchTimer = window.setTimeout(() => {
        glitchOverlay.classList.remove("is-active");
        terminal.classList.remove("is-glitching");
        backgroundReveal.classList.remove("is-glitching");
        glitchOverlay.textContent = "";
      }, duration + 40);
    }

    async function triggerJumpScareGlitch() {
      const duration = 760;
      const opacity = 0.84;

      window.clearTimeout(glitchTimer);
      renderGlitchFragments(9);
      [glitchOverlay, terminal, backgroundReveal].forEach((element) => {
        element.classList.remove("is-active", "is-glitching");
        element.style.setProperty("--glitch-duration", `${duration}ms`);
        element.style.setProperty("--glitch-opacity", opacity);
      });

      glitchOverlay.offsetWidth;
      glitchOverlay.classList.add("is-active");
      terminal.classList.add("is-glitching");
      backgroundReveal.classList.add("is-glitching");

      await wait(duration + 70);
      glitchOverlay.classList.remove("is-active");
      terminal.classList.remove("is-glitching");
      backgroundReveal.classList.remove("is-glitching");
      glitchOverlay.textContent = "";
    }

    function wait(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function randomDelay(speedName = "normal") {
      const speed = speeds[speedName] || speeds.normal;
      return speed.min + Math.random() * (speed.max - speed.min);
    }

    function appendCursor(line) {
      cursor.remove();
      line.appendChild(cursor);
    }

    function scrollToBottom() {
      terminal.scrollTo({ top: terminal.scrollHeight });
    }

    function alignLogoRule(lines) {
      const borderLine = lines.find((line) => line.dataset.logoRole === "border");
      if (!borderLine) {
        return;
      }

      lines
        .filter((line) => line.dataset.logoRole === "rule")
        .forEach((ruleLine) => {
          ruleLine.style.letterSpacing = "";
          const ruleLength = ruleLine.textContent.length;
          if (ruleLength <= 1) {
            return;
          }

          const widthGap = borderLine.scrollWidth - ruleLine.scrollWidth;
          if (widthGap > 0) {
            ruleLine.style.letterSpacing = `${widthGap / (ruleLength - 1)}px`;
          }
        });
    }

    function installMobileWin98Scrollbar(scrollElement) {
      const host = scrollElement.closest(".win98-content");
      if (!host || host.querySelector(".mobile-win98-scrollbar")) {
        return;
      }

      const scrollbar = document.createElement("div");
      scrollbar.className = "mobile-win98-scrollbar is-hidden";
      scrollbar.setAttribute("aria-hidden", "true");
      scrollbar.innerHTML = `
        <button class="mobile-win98-scrollbar-button" type="button" tabindex="-1">▲</button>
        <div class="mobile-win98-scrollbar-track">
          <div class="mobile-win98-scrollbar-thumb"></div>
        </div>
        <button class="mobile-win98-scrollbar-button" type="button" tabindex="-1">▼</button>
      `;
      host.appendChild(scrollbar);

      const [upButton, downButton] = scrollbar.querySelectorAll(".mobile-win98-scrollbar-button");
      const track = scrollbar.querySelector(".mobile-win98-scrollbar-track");
      const thumb = scrollbar.querySelector(".mobile-win98-scrollbar-thumb");

      function updateMobileScrollbar() {
        const maxScroll = scrollElement.scrollHeight - scrollElement.clientHeight;
        if (maxScroll <= 1) {
          scrollbar.classList.add("is-hidden");
          return;
        }

        scrollbar.classList.remove("is-hidden");
        const trackHeight = Math.max(1, track.clientHeight);
        const thumbHeight = Math.min(
          trackHeight,
          Math.max(28, Math.round(trackHeight * scrollElement.clientHeight / scrollElement.scrollHeight))
        );
        const travel = Math.max(0, trackHeight - thumbHeight);
        const thumbTop = Math.round((scrollElement.scrollTop / maxScroll) * travel);
        thumb.style.height = `${thumbHeight}px`;
        thumb.style.transform = `translateY(${thumbTop}px)`;
      }

      upButton.addEventListener("click", () => {
        scrollElement.scrollBy({ top: -scrollElement.clientHeight * 0.85, behavior: "smooth" });
      });
      downButton.addEventListener("click", () => {
        scrollElement.scrollBy({ top: scrollElement.clientHeight * 0.85, behavior: "smooth" });
      });
      scrollElement.addEventListener("scroll", updateMobileScrollbar, { passive: true });
      window.addEventListener("resize", updateMobileScrollbar);
      window.addEventListener("orientationchange", () => setTimeout(updateMobileScrollbar, 240));
      if (window.ResizeObserver) {
        new ResizeObserver(updateMobileScrollbar).observe(scrollElement);
      }
      setTimeout(updateMobileScrollbar, 0);
    }

    function getTerminalTextWidth() {
      const style = getComputedStyle(terminal);
      const paddingLeft = parseFloat(style.paddingLeft) || 0;
      const paddingRight = parseFloat(style.paddingRight) || 0;
      return Math.max(1, terminal.clientWidth - paddingLeft - paddingRight - 2);
    }

    function fitFixedWidthGroup(lines) {
      if (!lines.length) {
        return;
      }
      lines.forEach((line) => {
        line.style.fontSize = "";
        if (line.dataset.logoRole === "rule") {
          line.style.letterSpacing = "";
        }
      });
      const availableWidth = getTerminalTextWidth();
      const widestLine = lines.reduce((widest, line) => (
        line.scrollWidth > widest.scrollWidth ? line : widest
      ), lines[0]);
      if (widestLine.scrollWidth <= availableWidth) {
        alignLogoRule(lines);
        return;
      }
      const currentSize = parseFloat(getComputedStyle(widestLine).fontSize);
      if (!currentSize) {
        return;
      }
      const scale = Math.min(1, availableWidth / widestLine.scrollWidth);
      const fittedSize = `${currentSize * scale}px`;
      lines.forEach((line) => {
        line.style.fontSize = fittedSize;
      });
      alignLogoRule(lines);
    }

    function refitFixedWidthLines() {
      const groupedLines = new Map();
      terminal.querySelectorAll(".table-ascii, .logo-ascii").forEach((line) => {
        const groupId = line.dataset.fitGroup || `single-${Math.random()}`;
        if (!groupedLines.has(groupId)) {
          groupedLines.set(groupId, []);
        }
        groupedLines.get(groupId).push(line);
      });
      groupedLines.forEach(fitFixedWidthGroup);
    }

    function addLine(text = "", className = "") {
      const line = document.createElement("div");
      line.className = "line";
      if (className) {
        line.classList.add(...className.split(" ").filter(Boolean));
      }
      if (typeof text === "object" && text.html) {
        line.innerHTML = text.html;
      } else {
        line.textContent = text;
      }
      terminal.appendChild(line);
      scrollToBottom();
      return line;
    }

    async function typeLine(text = "", className = "", speedName = "normal") {
      const line = addLine("", className);
      appendCursor(line);

      const textNode = document.createTextNode("");
      const noise = document.createElement("span");
      noise.className = "pre-cursor-noise";
      line.insertBefore(textNode, cursor);
      line.insertBefore(noise, cursor);

      setBackgroundRainTyping(true);
      try {
        for (const character of text) {
          const flickers = speedName === "fast" ? 1 : 2 + Math.floor(Math.random() * 2);
          for (let index = 0; index < flickers; index += 1) {
            noise.textContent = randomNoiseText(speedName === "fast" ? 1 : 3);
            boostBackgroundRain(speedName === "fast" ? 0.12 : 0.22);
            await wait(speedName === "fast" ? 4 : 10 + Math.random() * 18);
          }

          noise.textContent = "";
          textNode.nodeValue += character;
          boostBackgroundRain(speedName === "fast" ? 0.18 : 0.28);
          scrollToBottom();
          await wait(randomDelay(speedName));
        }
      } finally {
        setBackgroundRainTyping(false);
        noise.remove();
      }

      await wait((speeds[speedName] || speeds.normal).lineDelay);
    }

    async function typeGroup(lines, className = "", speedName = "normal") {
      const textNodes = lines.map((text) => {
        const line = addLine("", className);
        const textNode = document.createTextNode("");
        const noise = document.createElement("span");
        noise.className = "pre-cursor-noise";
        line.appendChild(textNode);
        line.appendChild(noise);
        return { text, textNode, noise };
      });

      if (textNodes.length > 0) {
        appendCursor(terminal.lastElementChild);
      }

      const maxLength = Math.max(...lines.map((line) => line.length));
      setBackgroundRainTyping(true);
      try {
        for (let index = 0; index < maxLength; index += 1) {
          const flickers = speedName === "fast" ? 1 : 2;
          for (let flickerIndex = 0; flickerIndex < flickers; flickerIndex += 1) {
            for (const { text, noise } of textNodes) {
              noise.textContent = index < text.length ? randomNoiseText(speedName === "fast" ? 1 : 2) : "";
            }
            boostBackgroundRain(speedName === "fast" ? 0.14 : 0.26);
            await wait(speedName === "fast" ? 4 : 12);
          }

          for (const { text, textNode, noise } of textNodes) {
            noise.textContent = "";
            if (index < text.length) {
              textNode.nodeValue += text[index];
            }
          }
          boostBackgroundRain(speedName === "fast" ? 0.24 : 0.36);
          scrollToBottom();
          await wait(randomDelay(speedName));
        }
      } finally {
        setBackgroundRainTyping(false);
        for (const { noise } of textNodes) {
          noise.remove();
        }
      }

      await wait((speeds[speedName] || speeds.normal).lineDelay);
    }

    async function showLines(lines, delay = 0, className = "", perLineClass = {}) {
      cursor.remove();
      const shouldFitAsGroup = className.includes("table-ascii") || className.includes("logo-ascii");
      const fitGroupId = shouldFitAsGroup ? `fit-group-${fixedWidthGroupCounter += 1}` : "";
      const fittedLines = [];

      for (let index = 0; index < lines.length; index += 1) {
        const lineClass = Object.prototype.hasOwnProperty.call(perLineClass, index)
          ? perLineClass[index]
          : className;
        const line = addLine(lines[index], lineClass);
        if (shouldFitAsGroup && lineClass === className) {
          line.dataset.fitGroup = fitGroupId;
          if (className.includes("logo-ascii")) {
            if (/^=+$/.test(lines[index])) {
              line.dataset.logoRole = "border";
            } else if (/^-+$/.test(lines[index])) {
              line.dataset.logoRole = "rule";
            }
          }
          fittedLines.push(line);
          fitFixedWidthGroup(fittedLines);
        }
        if (delay > 0) {
          await wait(delay);
        }
      }

      await wait(delay > 0 ? 0 : 130);
    }

    function addLink(url) {
      cursor.remove();

      const line = addLine("");
      const link = document.createElement("a");
      link.className = "terminal-link";
      link.href = url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = url;
      line.appendChild(link);
      scrollToBottom();
    }

    function getShareLabels() {
      const languages = Array.isArray(navigator.languages) && navigator.languages.length > 0
        ? navigator.languages
        : [navigator.language || ""];
      const isJapanese = languages.some((language) => language.toLowerCase().startsWith("ja"));

      return isJapanese
        ? {
          share: "SHARE",
          native: "アプリで共有",
          x: "Xで共有",
          shareUnavailable: "[ERROR] このブラウザでは画像共有に対応していません。",
          shareFailed: "[ERROR] 画像共有に失敗しました。"
        }
        : {
          share: "SHARE",
          native: "Share on Apps",
          x: "Post on X",
          shareUnavailable: "[ERROR] image sharing is unavailable on this browser.",
          shareFailed: "[ERROR] image sharing failed."
        };
    }

    function addSharePrompt() {
      cursor.remove();
      addLine("");
      const shareLabels = getShareLabels();

      const form = document.createElement("form");
      form.className = "prompt-form share-form";
      form.setAttribute("aria-label", "share");

      const button = document.createElement("button");
      button.className = "send-button share-button";
      button.type = "submit";
      button.textContent = shareLabels.share;

      form.appendChild(button);
      terminal.appendChild(form);
      scrollToBottom();

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        button.disabled = true;
        showShareOutput();
      }, { once: true });
    }

    function showShareOutput() {
      addLine("");
      const shareLabels = getShareLabels();
      const shareGifPath = "./assets/imafindyou/goal_share.gif";
      const shareImagePath = "./assets/imafindyou/goal_share.png";

      const imageLine = document.createElement("div");
      imageLine.className = "line share-output";
      const image = document.createElement("img");
      image.className = "share-media";
      image.src = shareGifPath;
      image.alt = "[GOAL] deepest cyber layer reached.";
      imageLine.appendChild(image);
      terminal.appendChild(imageLine);

      addLine("");
      addLine("[OK] save/post enabled.");
      addLine("[OK] 保存・投稿可能。");
      addLine("");
      const buttonLine = document.createElement("div");
      buttonLine.className = "line share-output share-actions";
      const nativeButton = document.createElement("button");
      nativeButton.className = "send-button native-share-button";
      nativeButton.type = "button";
      nativeButton.textContent = shareLabels.native;
      const shareStatus = document.createElement("span");
      shareStatus.className = "share-status";

      nativeButton.addEventListener("click", async () => {
        shareStatus.textContent = "";

        if (!navigator.share || !navigator.canShare) {
          shareStatus.textContent = shareLabels.shareUnavailable;
          scrollToBottom();
          return;
        }

        try {
          const response = await fetch(shareImagePath);
          const blob = await response.blob();
          const file = new File([blob], "cyber_bloodlust_goal.png", { type: "image/png" });
          const shareData = {
            files: [file],
            title: "[GOAL] deepest cyber layer reached.",
            text: "[GOAL] deepest cyber layer reached. #cyber_bloodlust"
          };

          if (!navigator.canShare(shareData)) {
            shareStatus.textContent = shareLabels.shareUnavailable;
            scrollToBottom();
            return;
          }

          await navigator.share(shareData);
        } catch (error) {
          if (error?.name !== "AbortError") {
            shareStatus.textContent = shareLabels.shareFailed;
            scrollToBottom();
          }
        }
      });

      const xButton = document.createElement("a");
      xButton.className = "x-share-button";
      xButton.href = `https://twitter.com/intent/tweet?text=${encodeURIComponent("[GOAL] deepest cyber layer reached. #cyber_bloodlust")}`;
      xButton.target = "_blank";
      xButton.rel = "noopener noreferrer";
      xButton.setAttribute("aria-label", "Share on X");
      xButton.textContent = shareLabels.x;
      buttonLine.append(nativeButton, xButton, shareStatus);
      terminal.appendChild(buttonLine);
      scrollToBottom();
    }

    const specialAnswers = ["neru", "dbg_all"];

    function normalizeAnswer(value) {
      return value.trim().replace(/\s+/g, "").toLowerCase();
    }

    function isCommand(value, command) {
      return normalizeAnswer(value) === command;
    }

    function isLoveAnswer(value) {
      return normalizeAnswer(value) === "neru";
    }

    function isDebugAllAnswer(value) {
      return normalizeAnswer(value) === "dbg_all";
    }

    function addLoveAnswer() {
      addLine("");
      addLine("Thank you for playing<3", "pink");
    }

    function findSideAnswer(item, answer) {
      if (!item.sideAnswers) {
        return null;
      }

      const normalizedAnswer = normalizeAnswer(answer);
      return item.sideAnswers.find((sideAnswer) => (
        normalizeAnswer(sideAnswer.answer) === normalizedAnswer
      )) || null;
    }

    async function addSideAnswerAccess(sideAnswer) {
      const accessClassName = sideAnswer.className || "orange";
      addLine("");
      await typeGroup([
        "[OK] access authorized.",
        "[OK] アクセスが許可されました。"
      ], accessClassName, "fast");
      cursor.remove();

      if (sideAnswer.commandLine) {
        addLine("");
        await typeLine(sideAnswer.commandLine, accessClassName, "normal");
        cursor.remove();
      } else {
        addLine("");
      }

      const line = addLine("");
      const command = document.createElement("span");
      command.className = "dim";
      command.textContent = sideAnswer.linkPrompt || String.raw`C:\Users\lona\Memories> `;
      const link = document.createElement("a");
      link.className = "terminal-link access-link";
      link.href = sideAnswer.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = sideAnswer.label || sideAnswer.url;
      line.append(command, link);
      scrollToBottom();
    }

    function showLinesImmediate(lines, className = "", perLineClass = {}) {
      cursor.remove();
      const shouldFitAsGroup = className.includes("table-ascii") || className.includes("logo-ascii");
      const fitGroupId = shouldFitAsGroup ? `fit-group-${fixedWidthGroupCounter += 1}` : "";
      const fittedLines = [];

      for (let index = 0; index < lines.length; index += 1) {
        const lineClass = Object.prototype.hasOwnProperty.call(perLineClass, index)
          ? perLineClass[index]
          : className;
        const line = addLine(lines[index], lineClass);

        if (shouldFitAsGroup && lineClass === className) {
          line.dataset.fitGroup = fitGroupId;
          if (className.includes("logo-ascii")) {
            if (/^=+$/.test(lines[index])) {
              line.dataset.logoRole = "border";
            } else if (/^-+$/.test(lines[index])) {
              line.dataset.logoRole = "rule";
            }
          }
          fittedLines.push(line);
          fitFixedWidthGroup(fittedLines);
        }
      }
    }

    function showGroupImmediate(lines, className = "") {
      for (const line of lines) {
        addLine(line, className);
      }
    }

    function showSequenceImmediate(items) {
      for (const item of items) {
        if (item.pause || item.prompt || item.jumpGlitch) {
          continue;
        }

        if (item.blank) {
          addLine("");
        } else if (item.group) {
          showGroupImmediate(item.group, item.className || "");
        } else if (item.instant) {
          showLinesImmediate(item.instant, item.className || "", item.perLineClass || {});
        } else if (item.showLines) {
          showLinesImmediate(item.showLines, item.className || "", item.perLineClass || {});
        } else if (item.link) {
          addLink(item.link);
        } else if (item.sharePrompt) {
          addSharePrompt();
        } else if (item.type) {
          addLine(item.type, item.className || "");
        }
      }
    }

    function runDebugAll() {
      cursor.remove();
      stageIndex = stages.length - 1;
      updateBackgroundReveal();
      for (const sequence of stages.slice(1)) {
        showSequenceImmediate(sequence);
      }
      triggerProgressGlitch(stageIndex);
      scrollToBottom();
    }

    function addPromptForm(item) {
      cursor.remove();

      let hintAnswer;
      let hintTools;
      if (item.hints) {
        hintTools = document.createElement("div");
        hintTools.className = "prompt-tools";

        hintAnswer = document.createElement("div");
        hintAnswer.className = "hint-answer";

        terminal.append(hintTools, hintAnswer);
      }

      const form = document.createElement("form");
      form.className = "prompt-form";
      form.setAttribute("aria-label", item.prompt);
      const renderedSideAnswers = new Set();
      let loveAnswerRendered = false;

      const failMessage = document.createElement("div");
      failMessage.className = "prompt-fail";
      failMessage.setAttribute("aria-live", "polite");

      const input = document.createElement("input");
      input.className = "prompt-input";
      input.type = "text";
      input.inputMode = "text";
      input.autocomplete = "off";
      input.autocapitalize = "none";
      input.spellcheck = false;
      input.maxLength = Math.max(
        item.maxLength || 1,
        ...specialAnswers.map((answer) => answer.length),
        ...Object.keys(item.hints || {}).map((label) => label.length),
        ...(item.sideAnswers || []).map((sideAnswer) => sideAnswer.answer.length)
      );
      input.setAttribute("aria-label", item.prompt);

      if (item.hints) {
        Object.keys(item.hints).forEach((label) => {
          const hintButton = document.createElement("button");
          hintButton.className = "hint-button";
          hintButton.type = "button";
          hintButton.textContent = label;
          hintButton.addEventListener("click", () => {
            input.value = label;
            input.focus();
          });
          hintTools.appendChild(hintButton);
        });
      }

      const button = document.createElement("button");
      button.className = "send-button";
      button.type = "submit";
      button.textContent = "Send";

      form.append(input, button);
      terminal.appendChild(failMessage);
      terminal.appendChild(form);
      input.focus();
      scrollToBottom();

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const answer = input.value.trim();
        const hint = item.hints?.[answer];
        const sideAnswer = findSideAnswer(item, answer);

        if (item.debugAll && isDebugAllAnswer(answer)) {
          failMessage.textContent = "";
          input.disabled = true;
          button.disabled = true;
          runDebugAll();
          return;
        }

        if (isLoveAnswer(answer)) {
          failMessage.textContent = "";
          if (!loveAnswerRendered) {
            loveAnswerRendered = true;
            addLoveAnswer();
          }
          input.value = "";
          input.focus();
          scrollToBottom();
          return;
        }

        if (hint) {
          failMessage.textContent = "";
          hintAnswer.textContent = hint.join("\n");
          input.value = "";
          input.focus();
          scrollToBottom();
          return;
        }

        if (sideAnswer) {
          failMessage.textContent = "";
          const sideAnswerKey = `${normalizeAnswer(sideAnswer.answer)}:${sideAnswer.url}`;
          if (!renderedSideAnswers.has(sideAnswerKey)) {
            renderedSideAnswers.add(sideAnswerKey);
            await addSideAnswerAccess(sideAnswer);
          }
          input.value = "";
          input.focus();
          scrollToBottom();
          return;
        }

        if (item.abortOn?.(answer)) {
          failMessage.textContent = "";
          input.disabled = true;
          button.disabled = true;
          addLine("");
          await typeGroup(["[FAIL] decrypt process aborted."], "abort-fail", "fast");
          cursor.remove();
          scrollToBottom();
          return;
        }

        if (item.forceContinueOn?.(answer)) {
          failMessage.textContent = "";
          input.disabled = true;
          button.disabled = true;
          addLine("");
          for (const step of item.forceSequence || []) {
            if (step.blank) {
              addLine("");
            } else if (step.group) {
              await typeGroup(step.group, step.className || "", step.speed || "normal");
            } else if (step.type) {
              await typeLine(step.type, step.className || "", step.speed || "normal");
            }
          }
          cursor.remove();
          stageIndex += 1;
          updateBackgroundReveal();
          triggerProgressGlitch(stageIndex);
          await runSequence(stages[stageIndex]);
          return;
        }

        if (!item.validate(answer)) {
          failMessage.textContent = "[ERROR] invalid decryption.";
          input.value = "";
          input.focus();
          scrollToBottom();
          return;
        }

        failMessage.textContent = "";
        input.disabled = true;
        button.disabled = true;
        stageIndex += 1;
        updateBackgroundReveal();
        triggerProgressGlitch(stageIndex);
        await runSequence(stages[stageIndex]);
      });
    }

    async function runSequence(items) {
      for (const item of items) {
        if (item.pause) {
          cursor.remove();
          await wait(item.pause);
        } else if (item.prompt) {
          addPromptForm(item);
          return;
        } else if (item.blank) {
          await typeLine("");
        } else if (item.group) {
          await typeGroup(item.group, item.className || "", item.speed || "normal");
        } else if (item.instant) {
          await showLines(item.instant, 0, item.className || "", item.perLineClass || {});
        } else if (item.showLines) {
          await showLines(item.showLines, item.delay || 0, item.className || "", item.perLineClass || {});
        } else if (item.jumpGlitch) {
          await triggerJumpScareGlitch();
        } else if (item.link) {
          addLink(item.link);
        } else if (item.sharePrompt) {
          addSharePrompt();
        } else {
          await typeLine(item.type, item.className || "", item.speed || "normal");
        }
      }
    }

    updateBackgroundReveal();
    installMobileWin98Scrollbar(terminal);
    runSequence(stages[stageIndex]);
  </script>
