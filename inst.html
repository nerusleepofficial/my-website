<!DOCTYPE html>
<html lang="ja">
<head>

<link rel="icon" type="image/png" href="favicon.png">

<title>インスト配布 | Neru</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --white: #ffffff;
    --bg: #f9f9f7;
    --text-main: #1a1a1a;
    --text-sub: #555;
    --text-muted: #888;
    --border: #e0e0dc;
    --link: #2a6496;
    --tag-bg: #f2f2f0;
  }

  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif;
    background: var(--bg);
    color: var(--text-main);
    line-height: 1.8;
    font-size: 15px;
  }

  header {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 2.5rem 0 2rem;
    text-align: center;
  }

  header .site-name {
    font-size: 12px;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 0.75rem;
  }

  header h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  header .subtitle {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 0.5rem;
  }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 3rem 1.5rem 5rem;
  }

  .nav-links {
    display: flex;
    justify-content: center;
    gap: 0.75rem;
    flex-wrap: wrap;
    padding: 1rem 1.5rem;
    background: var(--white);
    border-bottom: 1px solid var(--border);
  }

  .nav-link {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 13px;
    font-weight: 600;
    color: #185fa5;
    text-decoration: none;
    padding: 0.5rem 1.1rem;
    border: 1.5px solid #85b7eb;
    border-radius: 4px;
    background: #e6f1fb;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    white-space: nowrap;
  }

  .nav-link:hover {
    background: #b5d4f4;
    border-color: #378add;
    color: #0c447c;
  }

  .nav-link svg {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .notice {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1.1rem 1.5rem;
    margin-bottom: 2.5rem;
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
  }

  .notice a {
    color: var(--link);
    text-decoration: none;
  }

  .notice a:hover { text-decoration: underline; }

  .track-list {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .track-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }

  .track-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1.5rem;
    gap: 1rem;
  }

  .track-title {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-align: center;
  }

  .track-body {
    display: flex;
    justify-content: center;
  }

  .track-meta {
    font-size: 13px;
    color: var(--text-muted);
  }

  .dl-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--text-main);
    color: var(--white);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 0.55rem 1.25rem;
    border-radius: 4px;
    transition: opacity 0.15s;
    white-space: nowrap;
  }

  .dl-btn:hover { opacity: 0.75; }

  .dl-btn svg {
    width: 14px;
    height: 14px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
  }

  footer {
    text-align: center;
    padding: 2rem;
    font-size: 12px;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
  }

  @media (max-width: 600px) {
    main { padding: 1.5rem 1rem 4rem; }
    header h1 { font-size: 18px; }
    .track-body { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
